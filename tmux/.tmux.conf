# Изменяем префикс с Ctrl+b на Ctrl+a (как в легендарном screen)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Включаем поддержку мыши (скролл, выбор окон, изменение размера панелей)
set -g mouse on

# Разделение панелей более логичными кнопками (| и -)
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Быстрая перезагрузка конфига кнопкой r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Best navigation as in Neovim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U 
bind l select-pane -R 

# support 256 colors
set -g default-terminal "screen-256color"
# window numbering with 1 
set -g base-index 1 
# panels numbering with 1 
setw -g pane-base-index 1
# reordring numbers when closing the window
set -g renumber-windows on 
#increase the buffer history limit
set -g history-limit 10000

# STATUS BAR SETTINGS

#status bar update frequency
set -g status-interval 5
#quoting the list of windows 
set -g status-justify centre
#colors status-bar: white text, black background
set -g status-style bg=black,fg=white
#Settings left part: show name of the session(green color)
set -g status-left-length 30
set -g status-left "#[fg=green]Session: #S"

#Highligthing the active window
setw -g window-status-current-style bg=blue,fg=white,bold

set -g status-right "#[fg=cyan]%d-%m-%Y #[fg=yellow]| %H:%M "
#Plugin manager

#List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' #Save sessions
set -g @plugin 'tmux-plugins/tmux-continuum' #Autosave
set -g @continuum-restore 'on' #Automatic recovery with start 

#Setting automatic recovery
set -g @continuum-restore 'on'

#Initalizing plugin manager (ALWAYS END THE FILE)
run '~/.tmux/plugins/tpm/tpm'

# Сохранение содержимого панелей (текст в терминале)
set -g @resurrect-capture-pane-contents 'on'

# Восстановление Neovim сессий (если используешь плагины сессий в nvim)
set -g @resurrect-strategy-nvim 'session'

# Интервал автосохранения (в минутах, по умолчанию 15, можно сделать 5)
set -g @continuum-save-interval '5'

set -g default-terminal "tmux-256color"

set -ag terminal-overrides ",xterm-256color:RGB"

# Зажми Ctrl+a и нажимай H,J,K,L (удерживая Ctrl или просто Shift)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

set -g @plugin 'tmux-plugins/tmux-cpu'

set -g status-right "#[fg=magenta]CPU: #{cpu_percentage} #[fg=cyan]%d-%m-%Y #[fg=yellow]| %H:%M "

# 1. Исправление задержки при нажатии ESC (критично для Neovim!)
set -s escape-time 0

# 2. Улучшение читаемости: границы панелей
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=blue

# 3. Интеграция с системным буфером обмена (Wayland/X11)
# Мы уже добавили xclip, но эта настройка делает работу с буфером "бесшовной"
set -g set-clipboard on

# 4. Фокус: подсвечивать окно, в котором произошло событие
setw -g monitor-activity on
set -g visual-activity off

set-option -g allow-rename off 
set-window-option -g automatic-rename off
